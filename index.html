<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather MVC App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app-bg">
    <div class="container py-4">
        <h1 class="mb-4">Погода</h1>

        <div class="row g-3 align-items-start">
            <div class="col-md-6">
                <div class="input-group">
                    <input id="city-input" class="form-control" placeholder="Введіть назву міста" />
                    <button id="search-btn" class="btn btn-primary">Пошук</button>
                </div>
                <div id="error" class="mt-2 text-danger" aria-live="polite"></div>

                <div id="current-weather" class="mt-4 card d-none">
                    <div class="card-body">
                        <h3 id="city-name"></h3>
                        <p id="weather-desc" class="mb-1"></p>
                        <p class="mb-1"><strong>Температура:</strong> <span id="temp"></span>°C</p>
                        <p class="mb-1"><strong>Вітер:</strong> <span id="wind"></span> м/с</p>
                        <button id="add-fav-btn" class="btn btn-outline-success btn-sm mt-2">Додати у вибрані</button>
                    </div>
                </div>

                <div id="forecast" class="mt-3 d-none">
                    <h5>Прогноз</h5>
                    <div id="forecast-cards" class="d-flex gap-2 flex-wrap"></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Вибрані міста</h5>
                    <ul id="favorites-list" class="list-group list-group-flush mt-2"></ul>
                </div>
            </div>
        </div>

    </div>
</div>

<script type="module" src="scripts/controller.js"></script>
</body>
</html>
